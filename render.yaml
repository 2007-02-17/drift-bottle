# Render Blueprint：在 Render 上选择「New + Blueprint」即可一键部署
# 免费计划使用临时文件系统，data.db 会随重新部署/实例重置而清空（详见 README 数据持久化说明）
services:
  - type: web
    name: drift-bottle
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "24"
